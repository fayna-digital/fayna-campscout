name: CI

# Запускається на PR у main + push у main.
# Блокує merge якщо lint / format / security checks fail.
# Використовує `.pre-commit-config.yaml` як джерело правди —
# ті самі хуки локально + на сервері.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs коли з'являється новий push у тій самій гілці
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + bandit + gitleaks + OCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Odoo unit tests (test-gate)
    runs-on: ubuntu-latest

    # Провалений Odoo-тест → червоний job → merge у main заблоковано
    # (за умови branch protection «require status check: test»).
    #
    # Dep-репо тепер публічні в організації fayna-digital, тому чекаутимо їх
    # напряму без SSH deploy keys (публічний доступ не потребує авторизації):
    #   fayna-digital/fayna-rodo-compliance
    #   fayna-digital/fayna-sms-base

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # health-check — Odoo стартує лише коли БД готова приймати з'єднання
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout portal (this repo)
        uses: actions/checkout@v4
        with:
          path: addons/fayna_camp_portal

      - name: Checkout dep — fayna_rodo_compliance
        uses: actions/checkout@v4
        with:
          repository: fayna-digital/fayna-rodo-compliance
          ref: main
          path: addons/deps/fayna_rodo_compliance

      - name: Checkout dep — fayna_sms_base
        uses: actions/checkout@v4
        with:
          repository: fayna-digital/fayna-sms-base
          ref: main
          path: addons/deps/fayna_sms_base

      - name: Run Odoo tests inside odoo:17 (Community) + coverage gate
        # odoo:17 — офіційний образ Community. Бере native-модулі з образу
        # (base, mail, contacts, portal, website, sale, event, event_sale,
        # account, loyalty, sms), а портал+deps монтуємо в addons-path.
        # Гейт (греп логу + exit code + coverage fail_under) — у
        # tools/run_odoo_tests.sh. COVERAGE=1 вмикає coverage-обгортку.
        run: |
          # odoo:17 runs as the non-root `odoo` user, so `pip install coverage`
          # lands in /var/lib/odoo/.local/bin which is NOT on PATH by default.
          # Prepend it so the `coverage` binary is found by run_odoo_tests.sh.
          docker run --rm \
            --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=odoo \
            -e PGPASSWORD=odoo \
            -e DB=test_camp \
            -e MODULE=fayna_camp_portal \
            -e ADDONS=/mnt/addons,/mnt/addons/deps \
            -e LOG=/tmp/odoo-test.log \
            -e COVERAGE=1 \
            -e COVERAGE_MIN=60 \
            -v "${{ github.workspace }}/addons:/mnt/addons:ro" \
            --entrypoint bash \
            odoo:17 -c "pip install coverage && export PATH=/var/lib/odoo/.local/bin:\$PATH && /mnt/addons/fayna_camp_portal/tools/run_odoo_tests.sh"

  upgrade:
    name: Odoo upgrade (-u) migration test
    runs-on: ubuntu-latest

    # OCA review: verify the module upgrades cleanly from a previous version.
    # Strategy: install the module into a fresh DB, then run `-u` (upgrade) on
    # the SAME DB so every migrations/<version>/post-migrate.py executes against
    # real pre-upgrade data. A migration that raises → Odoo exits non-zero →
    # job red. This is the standard OCA upgrade-gate (equivalent to the
    # `oca-ci` upgrade job).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout portal (this repo)
        uses: actions/checkout@v4
        with:
          path: addons/fayna_camp_portal

      - name: Checkout dep — fayna_rodo_compliance
        uses: actions/checkout@v4
        with:
          repository: fayna-digital/fayna-rodo-compliance
          ref: main
          path: addons/deps/fayna_rodo_compliance

      - name: Checkout dep — fayna_sms_base
        uses: actions/checkout@v4
        with:
          repository: fayna-digital/fayna-sms-base
          ref: main
          path: addons/deps/fayna_sms_base

      - name: Install module (baseline)
        # Fresh DB, install only — no tests. Establishes the pre-upgrade schema.
        run: |
          docker run --rm \
            --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=odoo \
            -e PGPASSWORD=odoo \
            -v "${{ github.workspace }}/addons:/mnt/addons:ro" \
            --entrypoint odoo \
            odoo:17 \
            -d upgrade_camp \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/addons,/mnt/addons/deps \
            -i fayna_camp_portal \
            --stop-after-init --no-http \
            --log-level=warn

      - name: Upgrade module (-u) and verify migrations run cleanly
        # Same DB, `-u` triggers every pending migrations/<version>/post-migrate.
        # Any migration error → non-zero exit → job red.
        run: |
          docker run --rm \
            --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=odoo \
            -e PGPASSWORD=odoo \
            -v "${{ github.workspace }}/addons:/mnt/addons:ro" \
            --entrypoint odoo \
            odoo:17 \
            -d upgrade_camp \
            --db_host=127.0.0.1 --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --addons-path=/mnt/addons,/mnt/addons/deps \
            -u fayna_camp_portal \
            --stop-after-init --no-http \
            --log-level=warn
